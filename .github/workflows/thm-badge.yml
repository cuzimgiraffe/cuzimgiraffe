name: TryHackMe badge
on:
  schedule:
    - cron: "23 4 * * *"   # pick any minute and hour you like, in UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: napahlm/thm-badge-generator@v1
        with:
          username: cuzimgiraffe
          theme: adventure / dark
